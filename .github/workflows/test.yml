name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test logic, files, HTTP and portable lifecycle
        run: npm test
      - name: Check syntax
        run: npm run check
      - name: Build Windows portable ZIP
        if: runner.os == 'Windows'
        run: npm run build:windows
      - name: Test packaged Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath dist/TextMask-2.0.0-windows-x64.zip -DestinationPath work/portable-test
          ./scripts/test-windows.ps1 -PackageRoot work/portable-test/TextMask-2.0.0-windows-x64
